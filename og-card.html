<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Pinyon+Script&family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #1e0608;
    font-family: 'Montserrat', sans-serif;
    color: #f7eedb;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Rich background layering */
  .bg-base {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 75% 50%, #3d0d12 0%, #200609 55%, #130305 100%);
    z-index: 1;
  }

  .bg-pattern {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(#c9922f 0.75px, transparent 0.75px);
    background-size: 28px 28px;
    opacity: 0.12;
    z-index: 2;
  }

  /* Outer Gold Ornamental Border */
  .outer-frame {
    position: absolute;
    inset: 20px;
    border: 1.5px solid rgba(201, 146, 47, 0.45);
    border-radius: 6px;
    z-index: 3;
    pointer-events: none;
  }

  .inner-frame {
    position: absolute;
    inset: 26px;
    border: 0.5px solid rgba(201, 146, 47, 0.25);
    border-radius: 4px;
    z-index: 3;
    pointer-events: none;
  }

  .corner-ornament {
    position: absolute;
    width: 32px;
    height: 32px;
    border: 2px solid #e5b95f;
    z-index: 4;
  }
  .corner-tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .corner-tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .corner-bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .corner-br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

  /* Main Container Split Layout */
  .card-content {
    position: relative;
    z-index: 10;
    width: 1120px;
    height: 550px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
  }

  /* Left Side: Real Couple Photo Arches */
  .photo-container {
    width: 480px;
    height: 520px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-glow {
    position: absolute;
    inset: 10px;
    background: radial-gradient(circle, rgba(201, 146, 47, 0.3) 0%, transparent 70%);
    filter: blur(25px);
    z-index: 1;
  }

  .photo-arch {
    width: 440px;
    height: 500px;
    border-radius: 220px 220px 12px 12px;
    overflow: hidden;
    position: relative;
    z-index: 2;
    border: 3px solid rgba(229, 185, 95, 0.85);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 25px rgba(201, 146, 47, 0.25);
  }

  .couple-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;
    display: block;
    transform: scale(1.02);
  }

  .photo-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(30, 6, 8, 0.1) 0%, rgba(30, 6, 8, 0.2) 60%, rgba(30, 6, 8, 0.6) 100%);
  }

  /* Secondary small floating badge on photo */
  .photo-tag {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 6, 8, 0.88);
    border: 1px solid rgba(201, 146, 47, 0.7);
    padding: 6px 18px;
    border-radius: 30px;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e5b95f;
    font-weight: 500;
    backdrop-filter: blur(8px);
    white-space: nowrap;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    z-index: 3;
  }

  /* Right Side: Typography & Details */
  .info-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px 10px;
  }

  .invitation-badge {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #e5b95f;
    padding: 6px 20px;
    border-top: 1px solid rgba(201, 146, 47, 0.5);
    border-bottom: 1px solid rgba(201, 146, 47, 0.5);
    margin-bottom: 20px;
  }

  .couple-names {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 15px;
  }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.05;
    background: linear-gradient(135deg, #ffffff 20%, #fdf2d0 60%, #e5b95f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
  }

  .subname {
    font-size: 24px;
    font-weight: 400;
    opacity: 0.85;
    letter-spacing: 0.5px;
  }

  .connector {
    font-family: 'Pinyon Script', cursive;
    font-size: 40px;
    color: #e5b95f;
    line-height: 0.9;
    margin: 2px 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .ornament-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 15px 0 20px 0;
    width: 80%;
  }

  .ornament-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201, 146, 47, 0.6), transparent);
  }

  .ornament-icon {
    color: #e5b95f;
    font-size: 16px;
  }

  .event-title {
    font-family: 'Cinzel', serif;
    font-size: 19px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: #fce39f;
    font-weight: 600;
    margin-bottom: 10px;
  }

  .event-details {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13.5px;
    letter-spacing: 1.5px;
    color: rgba(247, 238, 219, 0.88);
  }

  .date-time {
    font-weight: 500;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .venue-text {
    font-size: 13px;
    color: #e2ceab;
  }

  .footer-tag {
    margin-top: 22px;
    font-size: 11px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(201, 146, 47, 0.7);
  }
</style>
</head>
<body>
  <div class="bg-base"></div>
  <div class="bg-pattern"></div>
  <div class="outer-frame"></div>
  <div class="inner-frame"></div>
  <div class="corner-ornament corner-tl"></div>
  <div class="corner-ornament corner-tr"></div>
  <div class="corner-ornament corner-bl"></div>
  <div class="corner-ornament corner-br"></div>

  <div class="card-content">
    <!-- Left: Couple Photo -->
    <div class="photo-container">
      <div class="photo-glow"></div>
      <div class="photo-arch">
        <img class="couple-img" src="./editable/assets/couple-1.jpg" alt="Devangana & Hansraj">
        <div class="photo-overlay"></div>
      </div>
      <div class="photo-tag">#DevanganaWedsHansraj</div>
    </div>

    <!-- Right: Invitation Details -->
    <div class="info-panel">
      <div class="invitation-badge">Wedding Invitation</div>
      
      <div class="couple-names">
        <div class="name">Devangana <span class="subname">(Riya)</span></div>
        <div class="connector">weds</div>
        <div class="name">Hansraj <span class="subname">(Neer)</span></div>
      </div>

      <div class="ornament-divider">
        <div class="ornament-line"></div>
        <div class="ornament-icon">✦ ✤ ✦</div>
        <div class="ornament-line"></div>
      </div>

      <div class="event-title">Wedding Reception</div>
      
      <div class="event-details">
        <div class="date-time">
          <span>Friday, 11th December 2026</span>
          <span>·</span>
          <span>3:00 PM – 9:00 PM</span>
        </div>
        <div class="venue-text">Jaanki Farms and Resorts · Dhapkota, Jorhat, Assam</div>
      </div>

      <div class="footer-tag">invitestory.in</div>
    </div>
  </div>
</body>
</html>
