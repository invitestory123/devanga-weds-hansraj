    <style>

      @media (max-width: 539px) {

        height: 2.75rem;
        border-radius: 9999px;
        background: rgba(42, 11, 14, 0.85);
        border: 1px solid rgba(201, 146, 47, 0.65);
        color: #c9922f;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        padding: 0;
        outline: none;
      }
      #music-btn:hover {
        transform: scale(1.08);
        border-color: #e5b95f;

      }
      #music-btn:active {
        transform: scale(0.95);
      }

        animation: spin-disc 4s linear infinite;
      }
      #music-btn.playing {
        box-shadow: 0 0 14px rgba(201, 146, 47, 0.4);
      }
      @keyframes spin-disc {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }

  <body>
    <div id="root"></div>

    <!-- Music Player -->
    <div id="music-control">
      <audio id="wedding-audio" loop preload="auto" playsinline webkit-playsinline>
        <source src="./editable/assets/music.mp3" type="audio/mpeg">
        <source src="./editable/assets/music.webm" type="audio/webm">
      </audio>
      <button id="music-btn" type="button" aria-label="Toggle background music" title="Play / Pause Music">
        <svg class="music-disc" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2a10 10 0 0 1 10 10" stroke-width="2.5" stroke="#e5b95f"></path>
        </svg>
      </button>
    </div>

    <script>
      (function() {
        const audio = document.getElementById('wedding-audio');
        const btn = document.getElementById('music-btn');
        if (!audio || !btn) return;

        // Sync with WEDDING_DATA if custom music path defined
        try {
          const customMusic = window.WEDDING_DATA && window.WEDDING_DATA.assets && window.WEDDING_DATA.assets.music;
          if (customMusic && !audio.currentSrc) {
            audio.src = customMusic;
          }
        } catch (_) {}

        function updateState() {
          if (!audio.paused) {
            btn.classList.add('playing');
          } else {
            btn.classList.remove('playing');
          }
        }

        function tryPlay() {
          if (!audio.paused) {
            cleanupInteractionListeners();
            return;
          }
          const playPromise = audio.play();
          if (playPromise !== undefined) {
            playPromise.then(function() {
              updateState();
              cleanupInteractionListeners();
            }).catch(function() {
              // Autoplay waiting for direct user gesture
            });
          }
        }

        function onInteraction() {
          tryPlay();
        }

        function cleanupInteractionListeners() {
          document.removeEventListener('click', onInteraction);
          document.removeEventListener('touchstart', onInteraction);
          document.removeEventListener('touchend', onInteraction);
          document.removeEventListener('pointerdown', onInteraction);
          document.removeEventListener('keydown', onInteraction);
        }

        // Tap or click anywhere on page initiates music smoothly
        document.addEventListener('click', onInteraction, { passive: true });
        document.addEventListener('touchstart', onInteraction, { passive: true });
        document.addEventListener('touchend', onInteraction, { passive: true });
        document.addEventListener('pointerdown', onInteraction, { passive: true });
        document.addEventListener('keydown', onInteraction, { passive: true });

        // Direct button click toggles play / pause
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          e.preventDefault();
          if (audio.paused) {
            const p = audio.play();
            if (p !== undefined) {
              p.then(updateState).catch(function() {});
            }
          } else {
            audio.pause();
            updateState();
          }
        });

        audio.addEventListener('play', updateState);
        audio.addEventListener('playing', updateState);
        audio.addEventListener('pause', updateState);
        audio.addEventListener('ended', updateState);

        // Attempt initial autoplay on load if browser policy permits
        tryPlay();
      })();
    </script>
